<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173f2c">
    <meta name="description" content="2026 京都大阪六日行程地图：每天路线、交通、导航和票务提醒。">
    <title>京都大阪六日行程地图</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://tile.openstreetmap.org">
    <link rel="stylesheet" href="leaflet-base.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="trip-app" aria-label="京都大阪六日行程">
      <section class="map-panel" aria-label="当日路线地图">
        <div id="map" role="application" aria-label="互动行程地图"></div>
        <div class="map-wash" aria-hidden="true"></div>

        <header class="trip-header">
          <div class="trip-header__topline">
            <p class="brand-mark">KANSAI · 2026</p>
            <p class="trip-count"><span id="current-day-number">1</span> / 6 DAYS</p>
          </div>
          <h1 id="trip-title">京都大阪<br>六日漫游</h1>
          <p id="trip-subtitle" class="trip-header__subtitle">地图、交通与每日节奏，都放在一张随身行程里。</p>
        </header>

        <nav class="day-switcher" aria-label="选择行程日期">
          <div id="day-tabs" class="day-switcher__track"></div>
        </nav>

        <div id="map-fallback" class="map-fallback" role="status" hidden>
          <strong>地图暂时没有加载</strong>
          <span>下方行程与导航链接仍可正常使用。</span>
        </div>
      </section>

      <section id="itinerary-sheet" class="itinerary-sheet" aria-labelledby="day-title">
        <button id="sheet-handle" class="sheet-handle" type="button" aria-label="展开当天行程" aria-expanded="false">
          <span aria-hidden="true"></span>
        </button>

        <div class="sheet-mode-bar">
          <span id="edit-status">公开行程</span>
          <button id="edit-toggle" class="compact-button" type="button">编辑行程</button>
        </div>

        <div class="sheet-heading">
          <div>
            <p id="day-meta" class="sheet-heading__meta"></p>
            <h2 id="day-title"></h2>
          </div>
          <span id="day-status" class="status-badge" hidden></span>
        </div>

        <p id="day-summary" class="day-summary"></p>
        <div class="route-strip" aria-label="当天路线摘要">
          <span class="route-strip__dot" aria-hidden="true"></span>
          <strong id="day-route"></strong>
        </div>

        <section id="editor-toolbar" class="editor-toolbar" aria-label="行程编辑工具" hidden>
          <p>修改仅保存在这台设备。新增项目会插入在当前选中项目之后。</p>
          <div class="editor-toolbar__actions">
            <button id="add-stop" class="editor-action editor-action--primary" type="button">＋ 新增一项</button>
            <button id="edit-stop" class="editor-action" type="button">编辑当前项</button>
            <button id="delete-stop" class="editor-action editor-action--danger" type="button">删除当前项</button>
            <button id="export-edits" class="editor-action" type="button">导出修改</button>
            <button id="reset-edits" class="editor-action" type="button">恢复公开版</button>
          </div>
        </section>

        <ol id="timeline" class="timeline" aria-label="当天时间线"></ol>
      </section>
    </main>

    <dialog id="stop-editor" class="stop-editor" aria-labelledby="editor-title">
      <form id="stop-editor-form" class="stop-editor__form">
        <div class="stop-editor__heading">
          <div>
            <p id="editor-day-label"></p>
            <h2 id="editor-title">编辑行程项目</h2>
          </div>
          <button id="close-editor" class="icon-button" type="button" aria-label="关闭编辑窗口">×</button>
        </div>

        <input id="editor-mode" name="mode" type="hidden" value="edit">
        <label>时间<input id="editor-time" name="time" type="text" placeholder="例如 14:30 或 弹性"></label>
        <label>地点或项目名称（必填）<input id="editor-name" name="name" type="text" required maxlength="80"></label>
        <label>一句话摘要<input id="editor-summary" name="summary" type="text" maxlength="160"></label>
        <label>详细说明<textarea id="editor-detail" name="detail" rows="3" maxlength="500"></textarea></label>
        <div class="coordinate-grid">
          <label>纬度<input id="editor-latitude" name="latitude" type="number" step="any" min="-90" max="90" inputmode="decimal" placeholder="35.0116"></label>
          <label>经度<input id="editor-longitude" name="longitude" type="number" step="any" min="-180" max="180" inputmode="decimal" placeholder="135.7681"></label>
        </div>
        <p class="field-help">坐标可留空；填入后会显示地图标记。经纬度需要同时填写。</p>
        <label>官方信息链接<input id="editor-official-url" name="officialUrl" type="url" inputmode="url" placeholder="https://…"></label>
        <label>自定义导航链接<input id="editor-navigation-url" name="navigationUrl" type="url" inputmode="url" placeholder="https://…"></label>
        <p id="editor-error" class="editor-error" role="alert" hidden></p>

        <div class="stop-editor__actions">
          <button id="cancel-editor" class="editor-action" type="button">取消</button>
          <button class="editor-action editor-action--primary" type="submit">保存修改</button>
        </div>
      </form>
    </dialog>

    <div id="edit-toast" class="edit-toast" role="status" aria-live="polite" hidden></div>

    <noscript>请启用 JavaScript 查看日期切换与地图；行程数据保存在 itinerary-data.js。</noscript>
    <script type="module" src="app.js"></script>
    <script id="leaflet-script" async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </body>
</html>
